name: Scrape CUPE locals

on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Maximum CUPE directory pages to scrape. Leave 999 for all pages."
        required: true
        default: "999"
      detail_concurrency:
        description: "Number of local detail pages fetched in parallel."
        required: true
        default: "6"

permissions:
  contents: write

jobs:
  scrape-cupe-locals:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Scrape CUPE locals
        env:
          CUPE_MAX_PAGES: ${{ github.event.inputs.max_pages }}
          CUPE_DETAIL_CONCURRENCY: ${{ github.event.inputs.detail_concurrency }}
        run: npm run scrape:cupe

      - name: Commit generated CUPE data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cupe quartz/static/data/cupe-locals.json content/sections-locales/scfp-cupe.md
          if git diff --cached --quiet; then
            echo "No CUPE data changes to commit."
          else
            git commit -m "data: refresh CUPE locals"
            git push
          fi
